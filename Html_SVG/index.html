<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Common SVG Shapes</title>
  </head>

  <body>
    <main>
      <h1>Common SVG Shapes</h1>
      <p>
        SVG shapes are drawn with elements such as <code>&lt;rect&gt;</code>,
        <code>&lt;circle&gt;</code>, and <code>&lt;line&gt;</code>. The
        <code>viewBox</code> sets a reusable coordinate area for each drawing.
      </p>

      <section>
        <h2>Rectangle</h2>
        <svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="Blue rectangle">
          <rect x="10" y="10" width="100" height="60" fill="steelblue" />
        </svg>
      </section>

      <section>
        <h2>Rounded rectangle</h2>
        <svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="Green rounded rectangle">
          <rect x="10" y="10" width="100" height="60" rx="12" fill="seagreen" />
        </svg>
      </section>

      <section>
        <h2>Circle</h2>
        <svg viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Orange circle">
          <circle cx="50" cy="50" r="38" fill="orange" />
        </svg>
      </section>

      <section>
        <h2>Ellipse</h2>
        <svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="Purple ellipse">
          <ellipse cx="60" cy="40" rx="50" ry="28" fill="mediumpurple" />
        </svg>
      </section>

      <section>
        <h2>Line</h2>
        <svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="Red diagonal line">
          <line x1="10" y1="70" x2="110" y2="10" stroke="crimson" stroke-width="6" />
        </svg>
      </section>

      <section>
        <h2>Polyline</h2>
        <svg viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="Blue zigzag line">
          <polyline
            points="10,65 35,15 60,65 85,15 110,65"
            fill="none"
            stroke="steelblue"
            stroke-width="6"
            stroke-linejoin="round"
          />
        </svg>
      </section>

      <section>
        <h2>Polygon</h2>
        <svg viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Yellow triangle">
          <polygon points="50,8 94,90 6,90" fill="gold" />
        </svg>
      </section>

      <section>
        <h2>Path</h2>
        <svg viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Red heart">
          <path
            fill="red"
            d="M50 88 14 52C-8 29 18 3 40 23L50 33 60 23C82 3 108 29 86 52Z"
          />
        </svg>
      </section>
    </main>
  </body>
</html>
